</head>

<body>
    <header>
        <nav class="navbar">

            <div class="logo">
    <i class="bi bi-sun-fill"></i>

            </div>

<ul class="nav-links">
    <li><a href="#">Features</a></li>
    <li><a href="pages/dashboard.html">Dashboard</a></li>

        Home

</div>

</header>
<main class="setup-page">
    <section class="setup-section">
        <div class="setup-header">
            <h1>Configure Your Solar System</h1>
            <p>
                Enter your property details to generate personalised
                solar performance insights.
            </p>
        </div>

        <form class="setup-form" id="solarForm">
            <div class="form-group">
    <label for="location">Property Location</label>
    <input
        type="text"
        id="location"
        placeholder="e.g. Belfast, Northern Ireland"
        required>
</div>
<div class="form-group">
    <label for="roofSize">Roof Size (m²)</label>
    <input
        type="number"
        id="roofSize"
        placeholder="e.g. 120"
        required>
</div>
<div class="form-group">
    <label for="panels">Number of Solar Panels</label>
    <input
        type="number"
        id="panels"
        placeholder="e.g. 16"
        required>
</div>
<div class="form-group">
    <label for="angle">Roof Angle (°)</label>
    <input
        type="number"
        id="angle"
        placeholder="e.g. 35"
        required>
</div>
<div class="form-group">
    <label for="bill">Monthly Electricity Bill (£)</label>
    <input
        type="number"
        id="bill"
        placeholder="e.g. 95"
        required>
</div>
<div class="form-group">
    <label for="rate">Electricity Rate (£/kWh)</label>
    <input
        type="number"
        step="0.01"
        id="rate"
        placeholder="e.g. 0.29"
        required>
</div>
<button type="submit" class="primary-btn">
    Analyze My Solar System
</button>
        </form>
    </section>
</main>

</body>
